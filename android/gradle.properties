org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# ---- Oakcraft build inputs (override with -P on the command line) ----
# Where the phone should look for newer web files. Empty = no auto-update.
oakUpdateUrl=https://weboakcraft.github.io/New_Stock_Software
oakVersionName=1.0.0
oakVersionCode=1
# Set to true to run R8 shrinking on release builds.
oakMinify=false
