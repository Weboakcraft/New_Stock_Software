// Oakcraft Stock - the Android app module.
//
// The whole web app (index.html, assets/, gas/) is copied out of the repository
// root into the APK at build time by :app:bundleWebApp, so there is only ever one
// copy of the source. At runtime it is served over https://appassets.androidplatform.net,
// which is a secure origin - IndexedDB, the clipboard and getUserMedia all keep working.

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def appVersionName = (project.findProperty('oakVersionName') ?: '1.0.0').toString()
def appVersionCode = Integer.parseInt((project.findProperty('oakVersionCode') ?: '1').toString())
def updateBaseUrl  = (project.findProperty('oakUpdateUrl') ?: '').toString().replaceAll('/+$', '')
def useMinify      = (project.findProperty('oakMinify') ?: 'false').toString().toBoolean()

// ---- built-in Google Sheet connection (never committed; comes from CI secrets) ----
// When both are set the app connects itself on first launch and the Sync & Backup
// screen shows no address or secret for staff to see or change.
def syncUrl   = (project.findProperty('oakSyncUrl')   ?: System.getenv('OAK_SYNC_URL')   ?: '').toString().trim()
def syncToken = (project.findProperty('oakSyncToken') ?: System.getenv('OAK_SYNC_TOKEN') ?: '').toString().trim()
static String javaStr(String v) { '"' + v.replace('\\', '\\\\').replace('"', '\\"') + '"' }

// ---------------------------------------------------------------- signing
def ksPath      = (project.findProperty('oakKeystore') ?: System.getenv('OAK_KEYSTORE') ?: '').toString().trim()
def hasKeystore = !ksPath.isEmpty() && file(ksPath).exists()
if (!ksPath.isEmpty() && !hasKeystore) {
    logger.warn("Oakcraft: keystore '${ksPath}' was named but does not exist - building unsigned.")
}

// ------------------------------------------------- bundle the web app
def repoRoot = rootProject.projectDir.parentFile
def webStageDir = new File(project.layout.buildDirectory.get().asFile, 'generated/webAssets')

tasks.register('bundleWebApp', Sync) {
    group = 'oakcraft'
    description = 'Copies the Oakcraft Stock web app into the APK assets and writes version.json.'
    from(repoRoot) {
        include 'index.html'
        include 'offline.html'
        include 'manifest.webmanifest'
        include 'sw.js'
        include 'assets/**'
        include 'gas/**'
        exclude '**/.DS_Store'
        exclude '**/Thumbs.db'
    }
    into new File(webStageDir, 'web')
    doLast {
        def dir = new File(webStageDir, 'web')
        if (!new File(dir, 'index.html').exists()) {
            throw new GradleException("Oakcraft: index.html was not found in ${repoRoot} - is android/ still inside the repository?")
        }
        def entries = []
        dir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
            def rel = dir.toPath().relativize(f.toPath()).toString().replace('\\', '/')
            if (rel == 'version.json') return
            def md = java.security.MessageDigest.getInstance('SHA-256')
            f.withInputStream { ins ->
                byte[] buf = new byte[16384]
                int n
                while ((n = ins.read(buf)) > 0) md.update(buf, 0, n)
            }
            entries << [path: rel, bytes: f.length(), sha256: md.digest().encodeHex().toString()]
        }
        entries.sort { it.path }
        def payload = [
            app     : 'oakcraft-stock',
            version : "${appVersionName}+${appVersionCode}".toString(),
            source  : 'apk',
            builtAt : System.currentTimeMillis(),
            files   : entries
        ]
        new File(dir, 'version.json').setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(payload)), 'UTF-8')
        logger.lifecycle("Oakcraft: bundled ${entries.size()} web files into the APK.")
    }
}

android {
    namespace 'com.oakcraft.stock'   // Java package for the code. NOT the app id -
                                     // 'in' is a reserved Java keyword so it cannot be a package name.
    compileSdk 35

    defaultConfig {
        applicationId 'in.oakcraft.stock'
        minSdk 24
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName
        buildConfigField 'String', 'UPDATE_BASE_URL', "\"${updateBaseUrl}\""
        buildConfigField 'String', 'SYNC_URL',   javaStr(syncUrl)
        buildConfigField 'String', 'SYNC_TOKEN', javaStr(syncToken)
        vectorDrawables.useSupportLibrary = true
    }

    signingConfigs {
        if (hasKeystore) {
            release {
                storeFile     file(ksPath)
                storePassword (project.findProperty('oakKeystorePassword') ?: System.getenv('OAK_KEYSTORE_PASSWORD') ?: '').toString()
                keyAlias      (project.findProperty('oakKeyAlias')        ?: System.getenv('OAK_KEY_ALIAS')        ?: 'oakcraft').toString()
                keyPassword   (project.findProperty('oakKeyPassword')     ?: System.getenv('OAK_KEY_PASSWORD')     ?: '').toString()
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled useMinify
            shrinkResources useMinify
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasKeystore) signingConfig signingConfigs.release
        }
    }

    sourceSets {
        main {
            assets.srcDir webStageDir
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/*.kotlin_module']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// The asset merger must wait for the web files to be staged.
tasks.withType(com.android.build.gradle.tasks.MergeSourceSetFolders).configureEach {
    dependsOn tasks.named('bundleWebApp')
}
tasks.named('preBuild') { dependsOn tasks.named('bundleWebApp') }

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Camera barcode scanning
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    implementation 'com.google.mlkit:barcode-scanning:17.2.0'
}
