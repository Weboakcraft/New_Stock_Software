name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      update_url:
        description: "Where the app looks for newer screens (blank = this repo's GitHub Pages address)"
        required: false
        default: ''
      version_name:
        description: 'Version name (blank = 1.0.<run number>)'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'assets/**'
      - 'gas/**'
      - 'index.html'
      - 'offline.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  apk:
    name: Build the APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Work out the build settings
        id: cfg
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO="${{ github.event.repository.name }}"
          URL="${{ github.event.inputs.update_url }}"
          [ -n "$URL" ] || URL="https://$OWNER.github.io/$REPO"
          NAME="${{ github.event.inputs.version_name }}"
          [ -n "$NAME" ] || NAME="1.0.${{ github.run_number }}"
          echo "update_url=$URL"   >> "$GITHUB_OUTPUT"
          echo "version_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Update address : $URL"
          echo "Version name   : $NAME"

      - name: Find the signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p android/keystore
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/keystore/ci.jks
            echo "keystore=$GITHUB_WORKSPACE/android/keystore/ci.jks" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Using the key from the KEYSTORE_BASE64 secret."
          elif [ -f android/keystore/oakcraft.jks ]; then
            echo "keystore=$GITHUB_WORKSPACE/android/keystore/oakcraft.jks" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Using android/keystore/oakcraft.jks from the repository."
          else
            echo "keystore=" >> "$GITHUB_OUTPUT"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing key found — building a TEST apk instead. See DEPLOY.md step 2."
          fi

      - name: Build
        working-directory: android
        env:
          OAK_KEYSTORE: ${{ steps.signing.outputs.keystore }}
          OAK_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          OAK_KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'oakcraft' }}
          OAK_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Optional: bake the company Google Sheet into the APK so staff phones
          # connect themselves. Passed as environment variables, never on the
          # command line, so they cannot show up in a process list or a log.
          OAK_SYNC_URL: ${{ secrets.SYNC_URL }}
          OAK_SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then TASK=assembleRelease; else TASK=assembleDebug; fi
          ./gradlew --no-daemon --stacktrace "$TASK" \
            "-PoakUpdateUrl=${{ steps.cfg.outputs.update_url }}" \
            "-PoakVersionName=${{ steps.cfg.outputs.version_name }}" \
            "-PoakVersionCode=${{ github.run_number }}"

      - name: Collect the APK
        id: out
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' -type f | head -1)
          if [ -z "$APK" ]; then echo "No APK was produced."; exit 1; fi
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            cp "$APK" oakcraft-stock.apk
            echo "name=oakcraft-stock.apk" >> "$GITHUB_OUTPUT"
          else
            cp "$APK" oakcraft-stock-TESTING.apk
            echo "name=oakcraft-stock-TESTING.apk" >> "$GITHUB_OUTPUT"
          fi
          ls -lh oakcraft-stock*.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: oakcraft-stock-apk
          path: ${{ steps.out.outputs.name }}
          retention-days: 60

      - name: Keep a "latest" release with the APK in it
        if: github.ref == 'refs/heads/main' && steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "Oakcraft Stock — latest APK" \
              --notes "Built automatically from the newest commit. Copy the .apk to the phone and open it." --latest
          gh release upload latest oakcraft-stock.apk --clobber

      - name: Summary
        run: |
          {
            echo "### Oakcraft Stock APK"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| File | \`${{ steps.out.outputs.name }}\` |"
            echo "| Version | ${{ steps.cfg.outputs.version_name }} (code ${{ github.run_number }}) |"
            echo "| Update address | ${{ steps.cfg.outputs.update_url }} |"
            echo "| Signed with your key | ${{ steps.signing.outputs.signed }} |"
            if [ -n "${{ secrets.SYNC_URL }}" ] && [ -n "${{ secrets.SYNC_TOKEN }}" ]; then
              echo "| Google Sheet | built in - phones connect themselves |"
            else
              echo "| Google Sheet | not built in - each phone is set up by hand |"
            fi
            echo
            if [ "${{ steps.signing.outputs.signed }}" != "true" ]; then
              echo "> **This is a test build.** It installs, but a later build will be signed"
              echo "> with a different key and Android will refuse to update over it."
              echo "> Run \`bash tools/make-keystore.sh\` once and add the four repository"
              echo "> secrets it prints, then run this workflow again."
            fi
            echo
            echo "Download it from the **Artifacts** section at the bottom of this page."
          } >> "$GITHUB_STEP_SUMMARY"
